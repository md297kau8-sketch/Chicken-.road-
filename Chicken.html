<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#181c24">
  <title>Chicken Road Arcade - Real Sudden Hit Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase App SDK & Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    /* ==========================================================================
       1. GLOBAL MOBILE RESETS & COLOR PALETTE
       ========================================================================== */
    :root {
      --bg-dark: #0f1217;
      --header-bg: #1a1e27;
      --panel-bg: #212631;
      --control-card-bg: #2a303e;
      --input-bg: #353d4f;
      --border-color: #3d4659;
      --btn-green: #2ecc71;
      --btn-green-glow: #00e676;
      --btn-blue: #0091ea;
      --btn-blue-hover: #00b0ff;
      --btn-red: #ff3b30;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --accent-gold: #ffb300;
      --font-ui: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Fredoka', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-ui);
      color: var(--text-white);
      touch-action: manipulation;
    }

    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100dvh;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: #1f242e;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    /* ==========================================================================
       2. TOP BAR & LIVE MULTIPLAYER STRIP
       ========================================================================== */
    .top-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background-color: var(--header-bg);
      border-bottom: 2px solid #14171e;
      z-index: 30;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .brand-badge {
      background: #e74c3c;
      color: #fff;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 0.8rem;
    }

    .balance-pill {
      display: flex;
      align-items: center;
      background: #272d3a;
      border-radius: 9px;
      padding: 4px 10px;
      border: 1px solid #363e50;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .wallet-dropdown-btn {
      color: #7b889b;
      margin-right: 6px;
      font-size: 0.72rem;
    }
    .balance-val {
      font-size: 1.05rem;
      font-weight: 900;
      margin-right: 4px;
      color: #fff;
    }
    .taka-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 19px;
      height: 19px;
      background: #475267;
      border-radius: 50%;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .menu-burger {
      background: none;
      border: none;
      color: #c4cdd8;
      cursor: pointer;
      display: flex;
      padding: 4px;
    }

    /* Live Win Strip */
    .live-win-bar {
      position: absolute;
      top: 52px;
      left: 10px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }
    .online-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      font-weight: 800;
      color: #adb5bd;
      background: rgba(18, 20, 26, 0.88);
      padding: 2px 8px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      width: fit-content;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #2ecc71;
      border-radius: 50%;
      box-shadow: 0 0 6px #2ecc71;
    }
    .live-user-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(22, 26, 34, 0.95);
      border: 1px solid #333d4e;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.74rem;
      font-weight: 800;
      animation: fadeInSlide 0.4s ease-out;
    }
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateX(-15px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .user-cash { color: #2ecc71; font-weight: 900; }

    /* ==========================================================================
       3. ROAD CANVAS VIEWPORT
       ========================================================================== */
    .game-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      background: #3b3f47;
      overflow: hidden;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Cash Out Floating Celebration Splash */
    .cashout-splash {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(16, 20, 28, 0.96);
      border: 2px solid var(--btn-green);
      box-shadow: 0 10px 40px rgba(46, 204, 113, 0.5);
      padding: 18px 28px;
      border-radius: 20px;
      text-align: center;
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cashout-splash.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    .cashout-splash h3 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--btn-green);
      margin-bottom: 4px;
    }
    .cashout-splash p {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
    }

    /* ==========================================================================
       4. BOTTOM BETTING DOCK & DUAL BUTTON CONTROLS
       ========================================================================== */
    .bottom-bet-panel {
      position: relative;
      z-index: 30;
      background: var(--panel-bg);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      border-top: 2px solid #1a1e27;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.5);
    }
    .panel-card {
      background: var(--control-card-bg);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #374052;
    }

    /* Row 1: MIN / Amount / MAX */
    .input-row {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border-radius: 12px;
      height: 44px;
      padding: 3px;
      border: 1px solid #444f65;
    }
    .limit-btn {
      background: #475269;
      border: none;
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 0 16px;
      height: 100%;
      border-radius: 9px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.15s, transform 0.08s;
    }
    .limit-btn:active {
      background: #55627d;
      transform: scale(0.96);
    }
    .bet-input-box {
      flex: 1;
      text-align: center;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 900;
      font-family: var(--font-ui);
    }

    /* Row 2: Presets */
    .presets-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .preset-btn {
      background: var(--input-bg);
      border: 1px solid #434e63;
      color: #fff;
      border-radius: 9px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-weight: 900;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.12s;
    }
    .preset-btn:active {
      background: #4a5770;
      transform: scale(0.96);
    }

    /* Row 3: Difficulty */
    .dropdown-container {
      position: relative;
    }
    .difficulty-select-btn {
      width: 100%;
      height: 40px;
      background: var(--input-bg);
      border: 1px solid #434e63;
      border-radius: 9px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .dropdown-options {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      width: 100%;
      background: #232834;
      border: 1px solid #3c465a;
      border-radius: 12px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: none;
      z-index: 50;
    }
    .dropdown-options.show { display: block; }
    .opt-item {
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.88rem;
      border-bottom: 1px solid #2e3544;
      cursor: pointer;
    }
    .opt-item:hover, .opt-item.selected {
      background: #31394a;
      color: #2ecc71;
    }

    /* Row 4: DUAL BUTTONS */
    .action-button-group {
      display: flex;
      gap: 8px;
      width: 100%;
      height: 56px;
    }

    .btn-play-initial {
      flex: 1;
      height: 100%;
      background: var(--btn-green);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(46, 204, 113, 0.35);
      transition: transform 0.08s, background 0.15s;
    }
    .btn-play-initial:active {
      transform: scale(0.98);
    }

    .btn-go-forward {
      flex: 1;
      height: 100%;
      background: linear-gradient(180deg, #0091ea 0%, #0077c2 100%);
      border: none;
      border-bottom: 3px solid #005b94;
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 145, 234, 0.35);
      transition: transform 0.08s;
    }
    .btn-go-forward:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }

    .btn-cashout-take {
      flex: 1.25;
      height: 100%;
      background: linear-gradient(180deg, #00e676 0%, #00b359 100%);
      border: none;
      border-bottom: 3px solid #00873f;
      border-radius: 12px;
      color: #062b13;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      line-height: 1.1;
      box-shadow: 0 4px 18px rgba(0, 230, 118, 0.4);
      transition: transform 0.08s;
      animation: pulseCashout 1.5s infinite;
    }
    .btn-cashout-take:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }
    .btn-cashout-take:disabled {
      opacity: 0.55;
      filter: grayscale(1);
      animation: none;
      cursor: not-allowed;
    }
    .cashout-sub {
      font-size: 0.72rem;
      font-weight: 900;
      opacity: 0.85;
      font-family: var(--font-ui);
    }
    @keyframes pulseCashout {
      0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(0, 230, 118, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
    }

    /* Refill Modal */
    .dialog-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s;
    }
    .dialog-overlay.active { opacity: 1; visibility: visible; }
    .dialog-box {
      width: 100%;
      max-width: 320px;
      background: #232732;
      border: 1px solid #363e50;
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
    }
    .dialog-box h3 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .dialog-box p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .dialog-btn {
      width: 100%;
      height: 46px;
      background: var(--btn-green);
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

  <!-- ==========================================================================
       5. ARCADE ENGINE WITH SUDDEN SPEEDING CAR ATTACKS (হঠাৎ গাড়ি আক্রমণ)
       ========================================================================== */
  -->
  <script>
    'use strict';

    /* --- FIREBASE REALTIME DATABASE INITIALIZATION --- */
    const firebaseConfig = {
      apiKey: "AIzaSyAzG6l80RC_DnwKk7KlvVod2YU8GIC2oio",
      authDomain: "nskk-2ca2d.firebaseapp.com",
      databaseURL: "https://nskk-2ca2d-default-rtdb.firebaseio.com",
      projectId: "nskk-2ca2d",
      storageBucket: "nskk-2ca2d.firebasestorage.app",
      messagingSenderId: "629774743594",
      appId: "1:629774743594:web:a1610ad2d204eb791deb53",
      measurementId: "G-YDXWDVFPZ3"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    let activePhone = null;

    /* --- PROCEDURAL AUDIO WITH CAR HORN & TIRE SCREECH --- */
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playHop() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.1);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      /* গাড়ির হঠাৎ আক্রমণ হর্ন (Sudden Speed Car Horn) */
      playCarHorn() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [440, 554].forEach(f => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        });
      }

      /* তীব্র গতিতে ব্রেকের স্কিড সাউন্ড (Tire Screech) */
      playTireScreech() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.linearRampToValueAtTime(900, now + 0.35);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }

      /* মুরগির বাস্তবসম্মত আর্তনাদ / চিৎকার */
      playChickenSquawk() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.setValueAtTime(35, now);
        lfoGain.gain.setValueAtTime(160, now);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.linearRampToValueAtTime(1700, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.45);

        lfo.connect(osc.frequency);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1750, now);
        filter.Q.setValueAtTime(3.8, now);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        lfo.start(now);
        osc.start(now);
        osc.stop(now + 0.48);
        lfo.stop(now + 0.48);

        setTimeout(() => {
          if (!this.ctx) return;
          const now2 = this.ctx.currentTime;
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(1350, now2);
          osc2.frequency.exponentialRampToValueAtTime(320, now2 + 0.22);
          gain2.gain.setValueAtTime(0.25, now2);
          gain2.gain.linearRampToValueAtTime(0.001, now2 + 0.22);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now2);
          osc2.stop(now2 + 0.22);
        }, 85);
      }

      playCashout() {
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.5];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime + idx * 0.07;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        });
      }

      playCrash() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.3);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, now);
        filter.frequency.linearRampToValueAtTime(40, now + 0.3);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.3);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
    }

    /* --- REAL CHICKEN ROAD DIFFICULTY & CRASH PROBABILITY --- */
    const DIFFICULTY_PRESETS = {
      easy: {
        name: 'Easy',
        safeChance: 0.85, // ৮৫% নিরাপদ, ১৫% হঠাৎ গাড়ির আক্রমণ
        speed: 1.05,
        multipliers: [1.08, 1.18, 1.30, 1.45, 1.65, 1.92, 2.30, 2.80, 3.50, 4.60]
      },
      medium: {
        name: 'Medium',
        safeChance: 0.74, // ৭৪% নিরাপদ
        speed: 1.4,
        multipliers: [1.12, 1.28, 1.48, 1.75, 2.15, 2.68, 3.40, 4.40, 6.00, 8.50]
      },
      hard: {
        name: 'Hard',
        safeChance: 0.60, // ৬০% নিরাপদ, ৪০% হঠাৎ গাড়ির আক্রমণ
        speed: 1.8,
        multipliers: [1.18, 1.45, 1.82, 2.35, 3.15, 4.30, 6.00, 8.80, 13.00, 21.00]
      },
      daredevil: {
        name: 'Daredevil',
        safeChance: 0.42, // ৪২% নিরাপদ, ৫৮% হঠাৎ মারণ আক্রমণ
        speed: 2.25,
        multipliers: [1.30, 1.85, 2.75, 4.20, 6.70, 11.00, 19.00, 34.00, 65.00, 110.00]
      }
    };

    const CAR_TYPES = [
      { color: '#facc15', roofColor: '#ca8a04', name: 'taxi', hasTaxiLight: true },
      { color: '#00b0ff', roofColor: '#0284c7', name: 'sport', hasSpoiler: true },
      { color: '#f43f5e', roofColor: '#e11d48', name: 'sedan' },
      { color: '#fb923c', roofColor: '#ea580c', name: 'truck' }
    ];

    /* --- MASTER GAME ARCHITECTURE --- */
    class ChickenRoadMaster {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sound = new SoundFX();

        this.virtualBalance = 0.00;
        this.currentBet = 50;
        this.diffKey = 'easy';
        this.difficulty = DIFFICULTY_PRESETS[this.diffKey];

        this.state = 'IDLE'; // IDLE, RUNNING, CRASHED, WON
        this.currentStep = 0;
        this.totalLanes = 10;
        this.sidewalkWidth = 145;
        this.laneWidth = 105;

        this.cameraX = 0;
        this.targetCameraX = 0;
        this.screenShake = 0;

        // মুরগির জীবন্ত স্টেট
        this.chicken = {
          x: 85,
          y: 0,
          targetX: 85,
          targetY: 0,
          jumpProgress: 1,
          isJumping: false,
          dead: false,
          screaming: false,

          blinkTimer: 180,
          isBlinking: false,
          eyeGlanceX: 0,
          eyeGlanceY: 0,
          glanceTimer: 90,

          breathCycle: 0,
          combWobble: 0,
          tailWiggle: 0
        };

        this.lanes = [];
        this.trees = [];
        this.feathers = [];
        this.skidMarks = []; // রাস্তায় চাকার দাগ

        this.initDOM();
        this.initDatabaseSync();
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initWorld();

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.renderLoop(t));

        this.initLiveWinnerTicker();
      }

      /* 🚀 লাইভ ব্যালেন্স সিঙ্ক */
      initDatabaseSync() {
        const urlParams = new URLSearchParams(window.location.search);
        let phoneFound = urlParams.get('phone') || urlParams.get('user') || urlParams.get('uid');

        if (!phoneFound) {
          try {
            if (window.parent && window.parent.user && window.parent.user.phone) {
              phoneFound = window.parent.user.phone;
            }
          } catch(e) {}
        }

        if (!phoneFound) {
          try { phoneFound = localStorage.getItem('bd99_user'); } catch(e) {}
        }

        if (phoneFound) {
          this.bindUser(phoneFound);
        } else {
          database.ref('users').limitToLast(1).once('value', (snap) => {
            if (snap.exists()) {
              const data = snap.val();
              const lastPhone = Object.keys(data)[0];
              if (lastPhone) this.bindUser(lastPhone);
            }
          });
        }
      }

      bindUser(phone) {
        activePhone = phone;
        try { localStorage.setItem('bd99_user', phone); } catch(e) {}

        database.ref('users/' + phone + '/balance').on('value', (snapshot) => {
          if (snapshot.exists() && snapshot.val() !== null) {
            this.virtualBalance = parseFloat(snapshot.val()) || 0;
            this.updateBalanceDisplay();

            try {
              if (window.parent && window.parent.document) {
                window.parent.document.querySelectorAll('.userBalance').forEach(e => {
                  e.innerText = this.virtualBalance.toFixed(2);
                });
              }
            } catch(e) {}
          }
        });
      }

      deductRealBalance(amount) {
        this.virtualBalance = parseFloat((this.virtualBalance - amount).toFixed(2));
        this.updateBalanceDisplay();

        if (activePhone) {
          database.ref('users/' + activePhone + '/balance').transaction((curr) => {
            let val = parseFloat(curr);
            if (isNaN(val)) return 0;
            return Math.max(0, parseFloat((val - amount).toFixed(2)));
          });

          database.ref('users/' + activePhone + '/wager_left').transaction((curr) => {
            let left = parseFloat(curr || 0) - amount;
            return left < 0 ? 0 : parseFloat(left.toFixed(2));
          });
        }

        try {
          if (window.parent && window.parent.document) {
            window.parent.document.querySelectorAll('.userBalance').forEach(e => {
              e.innerText = this.virtualBalance.toFixed(2);
            });
          }
        } catch(e) {}
      }

      addRealBalance(amount) {
        if (amount <= 0) return;
        this.virtualBalance = parseFloat((this.virtualBalance + amount).toFixed(2));
        this.updateBalanceDisplay();

        if (activePhone) {
          database.ref('users/' + activePhone + '/balance').transaction((curr) => {
            let val = parseFloat(curr || 0);
            return parseFloat((val + amount).toFixed(2));
          });
        }

        try {
          if (window.parent && window.parent.document) {
            window.parent.document.querySelectorAll('.userBalance').forEach(e => {
              e.innerText = this.virtualBalance.toFixed(2);
            });
          }
        } catch(e) {}
      }

      initWorld() {
        this.trees = [];
        const h = this.canvas.height;
        for (let y = 30; y < h + 100; y += 75) {
          this.trees.push({
            x: 22 + (Math.sin(y) * 6),
            y: y,
            size: 24 + (Math.cos(y) * 4)
          });
        }

        this.lanes = [];
        const mults = this.difficulty.multipliers;

        for (let i = 0; i < this.totalLanes; i++) {
          const laneCenterX = this.sidewalkWidth + (i * this.laneWidth) + (this.laneWidth / 2);
          const dir = (i % 2 === 0) ? 1 : -1;
          const speed = (1.1 + Math.random() * 0.7) * this.difficulty.speed * dir;

          const carStyle1 = CAR_TYPES[Math.floor(Math.random() * CAR_TYPES.length)];
          const carStyle2 = CAR_TYPES[Math.floor(Math.random() * CAR_TYPES.length)];

          this.lanes.push({
            index: i + 1,
            centerX: laneCenterX,
            direction: dir,
            speed: speed,
            multiplier: mults[i] || +(mults[mults.length - 1] * 1.25).toFixed(2),
            warning: false,
            vehicles: [
              { y: Math.random() * 300, length: 72, width: 34, speedMultiplier: 1, ...carStyle1 },
              { y: Math.random() * 300 + 350, length: 76, width: 34, speedMultiplier: 1, ...carStyle2 }
            ]
          });
        }

        this.resetChicken();
      }

      resetChicken() {
        this.currentStep = 0;
        const startX = 85;
        const startY = this.canvas.height * 0.6;

        this.chicken.x = startX;
        this.chicken.y = startY;
        this.chicken.targetX = startX;
        this.chicken.targetY = startY;
        this.chicken.jumpProgress = 1;
        this.chicken.isJumping = false;
        this.chicken.dead = false;
        this.chicken.screaming = false;

        this.cameraX = 0;
        this.targetCameraX = 0;
        this.screenShake = 0;
        this.feathers = [];
        this.skidMarks = [];
      }

      initDOM() {
        this.updateBalanceDisplay();
        const betInput = document.getElementById('bet-input');

        betInput.addEventListener('change', () => {
          let val = parseInt(betInput.value, 10);
          if (isNaN(val) || val < 5) val = 5;
          if (val > 1999) val = 1999;
          this.currentBet = val;
          betInput.value = val;
        });

        document.getElementById('btn-min').onclick = () => {
          this.sound.init();
          this.currentBet = 5;
          betInput.value = 5;
        };

        document.getElementById('btn-max').onclick = () => {
          this.sound.init();
          this.currentBet = 1999;
          betInput.value = 1999;
        };

        document.querySelectorAll('.preset-btn').forEach(btn => {
          btn.onclick = () => {
            this.sound.init();
            const amt = parseInt(btn.dataset.amt, 10);
            this.currentBet = amt;
            betInput.value = amt;
          };
        });

        const diffBtn = document.getElementById('diff-toggle-btn');
        const diffMenu = document.getElementById('diff-menu');
        diffBtn.onclick = () => diffMenu.classList.toggle('show');

        document.querySelectorAll('.opt-item').forEach(item => {
          item.onclick = () => {
            if (this.state === 'RUNNING') return;
            document.querySelectorAll('.opt-item').forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            this.diffKey = item.dataset.diff;
            this.difficulty = DIFFICULTY_PRESETS[this.diffKey];
            document.getElementById('current-diff-text').textContent = this.difficulty.name;
            diffMenu.classList.remove('show');
            this.initWorld();
          };
        });

        this.renderButtons();
      }

      updateBalanceDisplay() {
        document.getElementById('user-balance-text').textContent = this.virtualBalance.toFixed(2);
      }

      renderButtons() {
        const container = document.getElementById('action-btn-container');

        if (this.state === 'IDLE' || this.state === 'CRASHED' || this.state === 'WON') {
          container.innerHTML = `<button class="btn-play-initial" id="btn-start-play">Play</button>`;
          document.getElementById('btn-start-play').onclick = () => {
            this.sound.init();
            this.startRound();
          };
        } else if (this.state === 'RUNNING') {
          const currentMult = this.currentStep === 0 ? 1.00 : this.lanes[this.currentStep - 1].multiplier;
          const currentWin = (this.currentBet * currentMult).toFixed(2);
          const isCashoutDisabled = (this.currentStep === 0);

          container.innerHTML = `
            <button class="btn-go-forward" id="btn-go-action">
              <span>GO</span> ➔
            </button>
            <button class="btn-cashout-take" id="btn-cashout-action" ${isCashoutDisabled ? 'disabled' : ''}>
              <span>CASH OUT</span>
              <span class="cashout-sub">৳${currentWin} (${currentMult.toFixed(2)}x)</span>
            </button>
          `;

          document.getElementById('btn-go-action').onclick = (e) => {
            e.stopPropagation();
            this.sound.init();
            this.stepForward();
          };

          document.getElementById('btn-cashout-action').onclick = (e) => {
            e.stopPropagation();
            this.sound.init();
            this.cashOut();
          };
        }
      }

      startRound() {
        if (this.virtualBalance < this.currentBet) {
          document.getElementById('refill-modal').classList.add('active');
          return;
        }

        this.deductRealBalance(this.currentBet);
        this.state = 'RUNNING';
        this.initWorld();
        this.renderButtons();
      }

      /* 💥 আসল চিকেন রোড: পা দেওয়ার সাথে সাথে হঠাৎ গাড়ির মারণ আক্রমণ লজিক */
      stepForward() {
        if (this.chicken.isJumping || this.chicken.dead) return;
        if (this.currentStep >= this.totalLanes) return;

        this.currentStep++;
        const targetLane = this.lanes[this.currentStep - 1];
        this.chicken.targetX = targetLane.centerX;
        this.chicken.jumpProgress = 0;
        this.chicken.isJumping = true;

        this.sound.playHop();

        // আরএনজি (RNG) নির্ধারণ করবে এই লেনে হঠাৎ গাড়ি আক্রমণ করবে কি না!
        const isSafe = Math.random() < this.difficulty.safeChance;

        if (!isSafe) {
          // ⚠️ হঠাৎ গাড়ি এসে মেরে দেবে!
          this.spawnSuddenAttackingCar(targetLane);
        } else {
          // নিরাপদ পারাপার: এই লেনের গাড়িগুলোকে মুরগির থেকে নিরাপদ দূরত্বে রাখা
          targetLane.vehicles.forEach(veh => {
            if (Math.abs(veh.y - this.chicken.y) < 140) {
              veh.y = (targetLane.direction > 0) ? this.chicken.y + 180 : this.chicken.y - 180;
            }
          });
        }

        this.renderButtons();
      }

      /* 🏎️ হঠাৎ প্রচণ্ড গতিতে গাড়ি এসে মুরগিকে পিষে ফেলা */
      spawnSuddenAttackingCar(lane) {
        lane.warning = true;
        
        // টায়ার ঘষা ও হর্নের তীব্র শব্দ
        setTimeout(() => {
          this.sound.playCarHorn();
          this.sound.playTireScreech();
        }, 60);

        // অতি দ্রুতগতির ঘাতক গাড়ি স্পন করা (Extreme Speed Killer Car)
        const isDown = lane.direction > 0;
        const attackCar = {
          y: isDown ? -180 : this.canvas.height + 180,
          length: 82,
          width: 36,
          color: '#ef4444', // ডেঞ্জার লাল গাড়ি
          roofColor: '#991b1b',
          isKiller: true,
          speedMultiplier: 5.5 // সাধারণ গাড়ির চেয়ে ৫ গুণ বেশি গতি!
        };

        lane.vehicles.push(attackCar);

        // রাস্তায় টায়ারের স্কিড মার্ক
        this.skidMarks.push({
          x: lane.centerX,
          y: this.chicken.y,
          alpha: 1
        });
      }

      cashOut() {
        if (this.state !== 'RUNNING' || this.currentStep === 0) return;

        const currentMult = this.lanes[this.currentStep - 1].multiplier;
        const winAmount = parseFloat((this.currentBet * currentMult).toFixed(2));
        
        this.addRealBalance(winAmount);

        this.sound.playCashout();
        this.state = 'WON';

        const alertBox = document.getElementById('cashout-alert');
        document.getElementById('alert-heading').textContent = `CASHED OUT (${currentMult.toFixed(2)}x)`;
        document.getElementById('alert-amount').textContent = `+${winAmount.toFixed(2)} ৳`;
        alertBox.classList.add('active');

        setTimeout(() => {
          alertBox.classList.remove('active');
          this.state = 'IDLE';
          this.initWorld();
          this.renderButtons();
        }, 1800);
      }

      /* গাড়ি এসে মেরে দিলে মুরগির তীব্র আর্তনাদ */
      triggerCrash() {
        this.state = 'CRASHED';
        this.chicken.dead = true;
        this.chicken.screaming = true;
        this.screenShake = 24; // তীব্র ঝাঁকুনি

        this.sound.playCrash();
        this.sound.playChickenSquawk();

        for (let i = 0; i < 28; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 8 + 3;
          this.feathers.push({
            x: this.chicken.x,
            y: this.chicken.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            rot: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 15,
            size: Math.random() * 8 + 5,
            color: Math.random() > 0.3 ? '#ffffff' : (Math.random() > 0.5 ? '#ef4444' : '#f59e0b'),
            alpha: 1
          });
        }

        const container = document.getElementById('action-btn-container');
        container.innerHTML = `<button class="btn-play-initial" style="background:#e74c3c;">CRASHED!</button>`;

        setTimeout(() => {
          this.state = 'IDLE';
          this.initWorld();
          this.renderButtons();
        }, 1800);
      }

      resize() {
        const box = document.getElementById('viewport-box');
        this.canvas.width = box.clientWidth;
        this.canvas.height = box.clientHeight;
        if (this.state === 'IDLE') this.resetChicken();
      }

      /* ==========================================================================
         6. RENDER LOOP & REALISTIC ANIMAL ANIMATION
         ========================================================================== */
      renderLoop(timestamp) {
        const dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;

        this.updatePhysics(dt);
        this.drawScene();

        requestAnimationFrame((t) => this.renderLoop(t));
      }

      updatePhysics(dt) {
        if (this.screenShake > 0) {
          this.screenShake *= 0.88;
          if (this.screenShake < 0.2) this.screenShake = 0;
        }

        this.chicken.breathCycle += dt * 3.5;
        this.chicken.combWobble = Math.sin(this.chicken.breathCycle * 1.5) * 0.12;
        this.chicken.tailWiggle = Math.sin(this.chicken.breathCycle * 2.2) * 0.15;

        this.chicken.blinkTimer -= 1;
        if (this.chicken.blinkTimer <= 0) {
          this.chicken.isBlinking = true;
          if (this.chicken.blinkTimer < -8) {
            this.chicken.isBlinking = false;
            this.chicken.blinkTimer = Math.floor(Math.random() * 160) + 120;
          }
        }

        this.chicken.glanceTimer -= 1;
        if (this.chicken.glanceTimer <= 0) {
          this.chicken.eyeGlanceX = (Math.random() - 0.3) * 3.2;
          this.chicken.eyeGlanceY = (Math.random() - 0.5) * 2;
          this.chicken.glanceTimer = Math.floor(Math.random() * 90) + 60;
        }

        if (this.chicken.isJumping) {
          this.chicken.jumpProgress += dt * 5.2;
          this.chicken.combWobble = Math.sin(this.chicken.jumpProgress * Math.PI) * 0.35;

          if (this.chicken.jumpProgress >= 1.0) {
            this.chicken.jumpProgress = 1.0;
            this.chicken.isJumping = false;
            this.chicken.x = this.chicken.targetX;
          } else {
            this.chicken.x += (this.chicken.targetX - this.chicken.x) * 0.38;
          }
        }

        if (this.chicken.x > this.canvas.width * 0.42) {
          this.targetCameraX = this.chicken.x - this.canvas.width * 0.42;
        } else {
          this.targetCameraX = 0;
        }
        this.cameraX += (this.targetCameraX - this.cameraX) * 0.12;

        for (let i = this.feathers.length - 1; i >= 0; i--) {
          const f = this.feathers[i];
          f.x += f.vx;
          f.y += f.vy;
          f.vy += 0.15;
          f.rot += f.rotSpeed;
          f.alpha -= 0.018;
          if (f.alpha <= 0) this.feathers.splice(i, 1);
        }

        // ট্রাফিক ফিজিক্স এবং হঠাৎ আক্রমণকারী গাড়ির গতি
        this.lanes.forEach(lane => {
          lane.vehicles.forEach(veh => {
            const vSpeed = veh.isKiller ? (lane.speed * veh.speedMultiplier) : lane.speed;
            veh.y += vSpeed * (dt * 60);

            if (lane.speed > 0 && veh.y > this.canvas.height + 250) {
              veh.y = -veh.length - 80;
            } else if (lane.speed < 0 && veh.y < -veh.length - 250) {
              veh.y = this.canvas.height + 80;
            }

            // কলিশন চেক (Collision Check)
            if (this.state === 'RUNNING' && !this.chicken.dead) {
              const chickenHitRadius = 22;
              const vBox = {
                left: lane.centerX - veh.width / 2 + 2,
                right: lane.centerX + veh.width / 2 - 2,
                top: veh.y + 2,
                bottom: veh.y + veh.length - 2
              };

              if (
                this.chicken.x + chickenHitRadius > vBox.left &&
                this.chicken.x - chickenHitRadius < vBox.right &&
                this.chicken.y + chickenHitRadius > vBox.top &&
                this.chicken.y - chickenHitRadius < vBox.bottom
              ) {
                this.triggerCrash(); // হঠাৎ গাড়ি এসে ধাক্কা দিলো!
              }
            }
          });
        });
      }

      drawScene() {
        this.ctx.save();
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        const shakeX = (Math.random() - 0.5) * this.screenShake;
        const shakeY = (Math.random() - 0.5) * this.screenShake;

        this.ctx.translate(-this.cameraX + shakeX, shakeY);

        this.drawEnvironment();
        this.drawRoadways();
        this.drawSkidMarks();
        this.drawManholes();
        this.drawRealisticVehicles();
        this.drawLifelikeChicken();
        this.drawFeathers();

        this.ctx.restore();
      }

      drawEnvironment() {
        const h = this.canvas.height;
        const sw = this.sidewalkWidth;

        this.ctx.fillStyle = '#55b839';
        this.ctx.fillRect(0, 0, 48, h);

        this.ctx.fillStyle = '#469c2d';
        for (let gy = 10; gy < h; gy += 24) {
          this.ctx.fillRect(10, gy, 3, 3);
          this.ctx.fillRect(36, gy + 12, 3, 3);
        }

        this.trees.forEach(tree => {
          this.drawRealisticTree(tree.x, tree.y, tree.size);
        });

        this.ctx.fillStyle = '#cfd5df';
        this.ctx.fillRect(48, 0, sw - 48, h);

        this.ctx.strokeStyle = '#b4bccb';
        this.ctx.lineWidth = 1.5;
        for (let y = 0; y < h; y += 44) {
          this.ctx.beginPath();
          this.ctx.moveTo(48, y);
          this.ctx.lineTo(sw, y);
          this.ctx.stroke();
        }

        this.ctx.fillStyle = '#9aa4b5';
        this.ctx.fillRect(sw - 8, 0, 8, h);
        this.ctx.fillStyle = '#7a8597';
        this.ctx.fillRect(sw - 2, 0, 2, h);

        const lampX = 94;
        const lampY = this.canvas.height * 0.16;

        const lightGlow = this.ctx.createRadialGradient(lampX, lampY + 4, 10, lampX, lampY + 40, 90);
        lightGlow.addColorStop(0, 'rgba(255, 245, 180, 0.28)');
        lightGlow.addColorStop(1, 'rgba(255, 245, 180, 0)');
        this.ctx.fillStyle = lightGlow;
        this.ctx.beginPath();
        this.ctx.arc(lampX, lampY + 40, 90, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#64748b';
        this.ctx.beginPath();
        this.ctx.ellipse(lampX, lampY + 120, 16, 7, 0, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#475569';
        this.ctx.fillRect(lampX - 4, lampY, 8, 120);

        this.ctx.fillStyle = '#334155';
        this.ctx.fillRect(lampX - 14, lampY - 8, 28, 12);
        this.ctx.fillStyle = '#fef08a';
        this.ctx.beginPath();
        this.ctx.arc(lampX, lampY + 4, 6, 0, Math.PI);
        this.ctx.fill();
      }

      drawRealisticTree(x, y, r) {
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        this.ctx.beginPath();
        this.ctx.ellipse(x + 2, y + r + 2, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#78350f';
        this.ctx.fillRect(x - 4, y, 8, r);

        this.ctx.fillStyle = '#2d6a1d';
        this.ctx.beginPath();
        this.ctx.arc(x, y, r, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#449e2b';
        this.ctx.beginPath();
        this.ctx.arc(x - 2, y - 4, r * 0.82, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#65c940';
        this.ctx.beginPath();
        this.ctx.arc(x - 4, y - 8, r * 0.52, 0, Math.PI * 2);
        this.ctx.fill();
      }

      drawRoadways() {
        const h = this.canvas.height;
        const roadW = (this.totalLanes + 2) * this.laneWidth;

        this.ctx.fillStyle = '#4e535c';
        this.ctx.fillRect(this.sidewalkWidth, 0, roadW, h);

        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 4;
        this.ctx.setLineDash([22, 22]);

        for (let i = 1; i <= this.totalLanes; i++) {
          const lx = this.sidewalkWidth + (i * this.laneWidth);
          this.ctx.beginPath();
          this.ctx.moveTo(lx, 0);
          this.ctx.lineTo(lx, h);
          this.ctx.stroke();
        }
        this.ctx.setLineDash([]);
      }

      /* চাকার কালো স্কিড দাগ (Tire Skid Marks) */
      drawSkidMarks() {
        this.skidMarks.forEach(s => {
          this.ctx.save();
          this.ctx.fillStyle = `rgba(20, 20, 20, ${s.alpha * 0.5})`;
          this.ctx.fillRect(s.x - 12, s.y - 45, 6, 90);
          this.ctx.fillRect(s.x + 6, s.y - 45, 6, 90);
          this.ctx.restore();
        });
      }

      drawManholes() {
        const cy = this.canvas.height * 0.6;
        const radius = 35;

        this.lanes.forEach((lane, idx) => {
          const cx = lane.centerX;
          const isTarget = (idx + 1 === this.currentStep);
          const isPassed = (idx + 1 < this.currentStep);

          this.ctx.save();

          if (isTarget) {
            this.ctx.strokeStyle = lane.warning ? 'rgba(239, 68, 68, 0.7)' : 'rgba(0, 230, 118, 0.4)';
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.arc(cx, cy, radius + 8, 0, Math.PI * 2);
            this.ctx.stroke();
          }

          this.ctx.fillStyle = isPassed ? '#3b434e' : '#3f444c';
          this.ctx.beginPath();
          this.ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.strokeStyle = isTarget ? (lane.warning ? '#ef4444' : '#00e676') : '#2a2d33';
          this.ctx.lineWidth = isTarget ? 4 : 3;
          this.ctx.stroke();

          this.ctx.beginPath();
          this.ctx.arc(cx, cy, radius - 7, 0, Math.PI * 2);
          this.ctx.strokeStyle = '#282b31';
          this.ctx.lineWidth = 2;
          this.ctx.stroke();

          this.ctx.strokeStyle = '#2b2e35';
          this.ctx.lineWidth = 2;
          for (let offset = -16; offset <= 16; offset += 8) {
            this.ctx.beginPath();
            this.ctx.moveTo(cx + offset, cy - 14);
            this.ctx.lineTo(cx + offset, cy + 14);
            this.ctx.stroke();
          }

          this.ctx.fillStyle = 'rgba(21, 24, 30, 0.85)';
          this.ctx.beginPath();
          this.ctx.arc(cx, cy, radius - 10, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.fillStyle = isPassed ? '#2ecc71' : '#f8fafc';
          this.ctx.font = '900 14px "Fredoka", sans-serif';
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(`${lane.multiplier.toFixed(2)}x`, cx, cy);

          this.ctx.restore();
        });
      }

      drawRealisticVehicles() {
        this.lanes.forEach(lane => {
          lane.vehicles.forEach(veh => {
            const vx = lane.centerX - veh.width / 2;
            const vy = veh.y;
            const isDownward = lane.direction > 0;

            this.ctx.save();

            // হঠাৎ স্পিডিং গাড়ির মোশন ব্লাস্ট ট্রেইল (Motion Blur)
            if (veh.isKiller) {
              this.ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
              this.ctx.fillRect(vx - 2, isDownward ? vy - 60 : vy + veh.length, veh.width + 4, 60);
            }

            const beamGradient = this.ctx.createLinearGradient(
              lane.centerX, vy + (isDownward ? veh.length : 0),
              lane.centerX, vy + (isDownward ? veh.length + 80 : -80)
            );
            beamGradient.addColorStop(0, veh.isKiller ? 'rgba(239, 68, 68, 0.7)' : 'rgba(254, 240, 138, 0.45)');
            beamGradient.addColorStop(1, 'rgba(254, 240, 138, 0)');

            this.ctx.fillStyle = beamGradient;
            this.ctx.beginPath();
            if (isDownward) {
              this.ctx.moveTo(vx + 4, vy + veh.length);
              this.ctx.lineTo(vx - 18, vy + veh.length + 80);
              this.ctx.lineTo(vx + veh.width + 18, vy + veh.length + 80);
              this.ctx.lineTo(vx + veh.width - 4, vy + veh.length);
            } else {
              this.ctx.moveTo(vx + 4, vy);
              this.ctx.lineTo(vx - 18, vy - 80);
              this.ctx.lineTo(vx + veh.width + 18, vy - 80);
              this.ctx.lineTo(vx + veh.width - 4, vy);
            }
            this.ctx.fill();

            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            this.ctx.beginPath();
            this.ctx.roundRect(vx + 3, vy + 4, veh.width, veh.length, 9);
            this.ctx.fill();

            this.ctx.fillStyle = '#0f172a';
            this.ctx.fillRect(vx - 3, vy + 10, 3, 14);
            this.ctx.fillRect(vx + veh.width, vy + 10, 3, 14);
            this.ctx.fillRect(vx - 3, vy + veh.length - 24, 3, 14);
            this.ctx.fillRect(vx + veh.width, vy + veh.length - 24, 3, 14);

            this.ctx.fillStyle = veh.color;
            this.ctx.beginPath();
            this.ctx.roundRect(vx, vy, veh.width, veh.length, 8);
            this.ctx.fill();

            this.ctx.fillStyle = '#0f172a';
            this.ctx.beginPath();
            this.ctx.roundRect(vx + 4, vy + 14, veh.width - 8, veh.length - 28, 5);
            this.ctx.fill();

            this.ctx.fillStyle = veh.roofColor;
            this.ctx.beginPath();
            this.ctx.roundRect(vx + 5, vy + 22, veh.width - 10, veh.length - 44, 4);
            this.ctx.fill();

            if (veh.hasTaxiLight) {
              this.ctx.fillStyle = '#ffffff';
              this.ctx.fillRect(lane.centerX - 7, vy + veh.length / 2 - 4, 14, 8);
              this.ctx.fillStyle = '#000000';
              this.ctx.font = '900 6px sans-serif';
              this.ctx.fillText('TAXI', lane.centerX, vy + veh.length / 2 + 2);
            }

            if (isDownward) {
              this.ctx.fillStyle = '#fef08a';
              this.ctx.fillRect(vx + 3, vy + veh.length - 3, 7, 3);
              this.ctx.fillRect(vx + veh.width - 10, vy + veh.length - 3, 7, 3);
              this.ctx.fillStyle = '#ef4444';
              this.ctx.fillRect(vx + 3, vy, 7, 3);
              this.ctx.fillRect(vx + veh.width - 10, vy, 7, 3);
            } else {
              this.ctx.fillStyle = '#fef08a';
              this.ctx.fillRect(vx + 3, vy, 7, 3);
              this.ctx.fillRect(vx + veh.width - 10, vy, 7, 3);
              this.ctx.fillStyle = '#ef4444';
              this.ctx.fillRect(vx + 3, vy + veh.length - 3, 7, 3);
              this.ctx.fillRect(vx + veh.width - 10, vy + veh.length - 3, 7, 3);
            }

            this.ctx.restore();
          });
        });
      }

      drawLifelikeChicken() {
        const cx = this.chicken.x;
        let cy = this.chicken.y;

        let jumpOffset = 0;
        if (this.chicken.isJumping) {
          jumpOffset = -Math.sin(this.chicken.jumpProgress * Math.PI) * 32;
        }

        const breathY = Math.sin(this.chicken.breathCycle) * 1.5;
        const breathScaleX = 1 + Math.sin(this.chicken.breathCycle) * 0.025;
        const breathScaleY = 1 - Math.sin(this.chicken.breathCycle) * 0.02;

        this.ctx.save();
        this.ctx.translate(cx, cy + jumpOffset + breathY);

        if (this.chicken.dead) {
          this.ctx.scale(1.4, 0.45);
        } else {
          this.ctx.scale(breathScaleX, breathScaleY);
        }

        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 22 - jumpOffset * 0.4, 22, 9, 0, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.save();
        this.ctx.translate(-22, -4);
        this.ctx.rotate(this.chicken.tailWiggle);
        this.ctx.fillStyle = '#f1f5f9';
        this.ctx.strokeStyle = '#334155';
        this.ctx.lineWidth = 2.4;

        this.ctx.beginPath();
        this.ctx.ellipse(-4, -6, 10, 6, -0.6, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.ellipse(-3, 2, 9, 5, 0.2, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.stroke();
        this.ctx.restore();

        this.ctx.fillStyle = '#f59e0b';
        this.ctx.strokeStyle = '#d97706';
        this.ctx.lineWidth = 1.5;

        this.ctx.fillRect(-14, 16, 9, 7);
        this.ctx.strokeRect(-14, 16, 9, 7);
        this.ctx.fillRect(5, 16, 9, 7);
        this.ctx.strokeRect(5, 16, 9, 7);

        this.ctx.fillStyle = '#e2e8f0';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 4, 26, 22, 0, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 1, 25, 21, 0, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.strokeStyle = '#334155';
        this.ctx.lineWidth = 2.8;
        this.ctx.stroke();

        this.ctx.save();
        this.ctx.translate(-8, 3);
        const wingAngle = this.chicken.dead ? 0.8 : (this.chicken.combWobble * 0.4);
        this.ctx.rotate(wingAngle);

        this.ctx.fillStyle = '#f8fafc';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 0, 12, 8, 0.2, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.stroke();

        this.ctx.strokeStyle = '#cbd5e1';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        this.ctx.arc(-2, 0, 7, 0.3, Math.PI * 0.8);
        this.ctx.stroke();
        this.ctx.restore();

        this.ctx.save();
        this.ctx.translate(2, -20);
        this.ctx.rotate(this.chicken.combWobble);

        this.ctx.fillStyle = '#ef4444';
        this.ctx.strokeStyle = '#334155';
        this.ctx.lineWidth = 2.4;

        this.ctx.beginPath();
        this.ctx.arc(-9, 0, 6, 0, Math.PI * 2);
        this.ctx.arc(0, -5, 7.5, 0, Math.PI * 2);
        this.ctx.arc(9, 1, 6, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.stroke();
        this.ctx.restore();

        const eyeCenterX = 8;
        const eyeCenterY = -6;

        if (this.chicken.dead) {
          this.ctx.strokeStyle = '#0f172a';
          this.ctx.lineWidth = 3.2;

          this.ctx.beginPath();
          this.ctx.moveTo(3, -12);
          this.ctx.lineTo(13, -2);
          this.ctx.moveTo(13, -12);
          this.ctx.lineTo(3, -2);
          this.ctx.stroke();
        } else if (this.chicken.isBlinking) {
          this.ctx.strokeStyle = '#334155';
          this.ctx.lineWidth = 3;
          this.ctx.beginPath();
          this.ctx.arc(eyeCenterX, eyeCenterY, 9, 0.2, Math.PI - 0.2);
          this.ctx.stroke();
        } else {
          this.ctx.fillStyle = '#ffffff';
          this.ctx.beginPath();
          this.ctx.arc(eyeCenterX, eyeCenterY, 9.5, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.strokeStyle = '#334155';
          this.ctx.lineWidth = 2.6;
          this.ctx.stroke();

          const pupilX = eyeCenterX + 2 + this.chicken.eyeGlanceX;
          const pupilY = eyeCenterY + this.chicken.eyeGlanceY;

          this.ctx.fillStyle = '#0f172a';
          this.ctx.beginPath();
          this.ctx.arc(pupilX, pupilY, 4.8, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.fillStyle = '#ffffff';
          this.ctx.beginPath();
          this.ctx.arc(pupilX - 1.5, pupilY - 1.8, 1.8, 0, Math.PI * 2);
          this.ctx.arc(pupilX + 1.8, pupilY + 1.2, 0.9, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.fillStyle = 'rgba(244, 114, 182, 0.55)';
          this.ctx.beginPath();
          this.ctx.ellipse(3, 6, 5.5, 3.2, 0, 0, Math.PI * 2);
          this.ctx.fill();
        }

        if (this.chicken.dead) {
          this.ctx.fillStyle = '#ea580c';
          this.ctx.strokeStyle = '#334155';
          this.ctx.lineWidth = 2.4;

          this.ctx.beginPath();
          this.ctx.moveTo(15, -9);
          this.ctx.lineTo(29, -5);
          this.ctx.lineTo(15, -1);
          this.ctx.fill();
          this.ctx.stroke();

          this.ctx.beginPath();
          this.ctx.moveTo(15, 2);
          this.ctx.lineTo(28, 9);
          this.ctx.lineTo(15, 11);
          this.ctx.fill();
          this.ctx.stroke();

          this.ctx.fillStyle = '#7f1d1d';
          this.ctx.beginPath();
          this.ctx.ellipse(16, 1, 5, 7, 0, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.fillStyle = '#ef4444';
          this.ctx.beginPath();
          this.ctx.arc(17, 3, 3, 0, Math.PI * 2);
          this.ctx.fill();
        } else {
          this.ctx.fillStyle = '#f97316';
          this.ctx.strokeStyle = '#334155';
          this.ctx.lineWidth = 2.4;

          this.ctx.beginPath();
          this.ctx.moveTo(16, -4);
          this.ctx.lineTo(28, -1);
          this.ctx.lineTo(16, 6);
          this.ctx.closePath();
          this.ctx.fill();
          this.ctx.stroke();
        }

        this.ctx.save();
        this.ctx.translate(14, 9);
        this.ctx.rotate(this.chicken.combWobble * 0.8);
        this.ctx.fillStyle = '#dc2626';
        this.ctx.beginPath();
        this.ctx.arc(0, 0, 4.8, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.strokeStyle = '#334155';
        this.ctx.lineWidth = 2;
        this.ctx.stroke();
        this.ctx.restore();

        this.ctx.restore();

        if (this.chicken.screaming) {
          this.ctx.save();
          this.ctx.translate(cx, cy - 48);

          this.ctx.fillStyle = '#ff3b30';
          this.ctx.strokeStyle = '#ffffff';
          this.ctx.lineWidth = 3.5;
          this.ctx.font = '900 20px "Fredoka", sans-serif';
          this.ctx.textAlign = 'center';
          this.ctx.strokeText('BWAAAK!! 💥', 0, 0);
          this.ctx.fillText('BWAAAK!! 💥', 0, 0);

          this.ctx.restore();
        }
      }

      drawFeathers() {
        this.feathers.forEach(f => {
          this.ctx.save();
          this.ctx.translate(f.x, f.y);
          this.ctx.rotate((f.rot * Math.PI) / 180);
          this.ctx.globalAlpha = f.alpha;
          this.ctx.fillStyle = f.color;
          this.ctx.beginPath();
          this.ctx.ellipse(0, 0, f.size, f.size * 0.45, 0, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.restore();
        });
      }

      initLiveWinnerTicker() {
        const names = ['Fahim', 'Majdi', 'Tariq', 'Sabbir', 'Hasan', 'Tanvir', 'Mustafa', 'Arefin'];
        const flags = ['🇦🇪', '🇵🇸', '🇧🇩', '🇹🇷', '🇲🇾', '🇶🇦', '🇸🇦'];
        const toast = document.getElementById('live-user-toast');
        const userTxt = document.getElementById('toast-username');
        const winTxt = document.getElementById('toast-winamount');
        const onlineCount = document.getElementById('online-counter');

        setInterval(() => {
          const currentCount = parseInt(onlineCount.textContent, 10);
          onlineCount.textContent = currentCount + (Math.floor(Math.random() * 5) - 2);

          const name = names[Math.floor(Math.random() * names.length)];
          const flag = flags[Math.floor(Math.random() * flags.length)];
          const win = (Math.random() * 380 + 40).toFixed(2);

          toast.style.display = 'none';
          void toast.offsetWidth;
          toast.style.display = 'flex';

          document.querySelector('.user-avatar').textContent = flag;
          userTxt.textContent = name;
          winTxt.textContent = `+৳${win}`;
        }, 5000);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new ChickenRoadMaster();
    });
  </script>
</body>
</html>
